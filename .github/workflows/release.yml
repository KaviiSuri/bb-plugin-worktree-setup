name: Release

# On-demand only: trigger from the Actions tab (or `gh workflow run release.yml`).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Exact version (only used when bump = custom, e.g. 1.4.2)"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bb
        run: npm install -g bb-app

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ inputs.bump }}" = "custom" ]; then
            if [ -z "${{ inputs.custom_version }}" ]; then
              echo "custom_version is required when bump = custom" >&2
              exit 1
            fi
            spec="${{ inputs.custom_version }}"
          else
            spec="${{ inputs.bump }}"
          fi
          new_version=$(npm version "$spec" --no-git-tag-version)
          new_version="${new_version#v}"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null; then
            echo "tag ${{ steps.bump.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Build plugin
        run: bb plugin build .

      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          git add package.json package-lock.json dist/
          git commit -m "release: ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.bump.outputs.tag }}"
            echo ""
            echo "Install with:"
            echo '```sh'
            echo "bb plugin install git:https://github.com/KaviiSuri/bb-plugin-worktree-setup.git@${{ steps.bump.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
